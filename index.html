<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>未来编年史 · Epic of the Future</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }

  :root {
    --bg:          #f5f6fa;
    --line:        #dcdfea;
    --dot:         #5b7cfa;
    --dot-2:       #8a5bfa;
    --card-bg:     #ffffff;
    --card-border: #e7e9f2;
    --title:       #1f2430;
    --text:        #5c6274;
    --muted:       #8b90a3;
    --danger:      #e5484d;
    --highlight:   #ffd76a;
    --gap:     46px;
    --vgap:    40px;
    --dot-top: 22px;
  }

  html, body { margin: 0; }

  body {
    padding: 32px 16px 100px;
    background: var(--bg);
    color: var(--title);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }

  /* ================= 页头 ================= */
  .hero { max-width: 1040px; margin: 0 auto 16px; text-align: center; position: relative; }

  .hero__title {
    margin: 0;
    font-size: clamp(22px, 6vw, 34px);
    letter-spacing: .12em;
    background: linear-gradient(135deg, #5b7cfa, #8a5bfa 60%, #c85bfa);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .hero__sub {
    margin: 6px 0 0;
    font-size: clamp(10px, 2.5vw, 13px);
    letter-spacing: .34em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* 登录状态栏 */
  .auth-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 0 auto 20px;
    padding: 8px 16px;
    max-width: 640px;
    background: #fff;
    border: 1px solid var(--card-border);
    border-radius: 999px;
    font-size: 13px;
    color: var(--text);
  }

  .auth-bar__dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #c4c9d9;
    flex-shrink: 0;
  }

  .auth-bar__dot.is-online { background: #2ecc71; }

  .auth-bar__btn {
    padding: 4px 14px;
    font: inherit; font-size: 12px;
    color: var(--dot);
    background: rgba(91, 124, 250, .10);
    border: none; border-radius: 999px;
    cursor: pointer;
  }

  .auth-bar__btn:hover { color: #fff; background: var(--dot); }

  /* ================= 搜索栏 ================= */
  .searchbar {
    display: flex;
    gap: 8px;
    max-width: 640px;
    margin: 0 auto 20px;
    padding: 5px;
    background: #fff;
    border: 1px solid var(--card-border);
    border-radius: 999px;
    box-shadow: 0 4px 14px rgba(31, 36, 48, .05);
  }

  .searchbar__input {
    flex: 1; min-width: 0;
    padding: 9px 16px;
    font: inherit; font-size: 14px;
    color: var(--title);
    background: transparent;
    border: none; outline: none;
  }

  .searchbar__btn {
    flex-shrink: 0;
    padding: 9px 18px;
    font: inherit; font-size: 14px; font-weight: 600;
    color: #fff;
    background: linear-gradient(135deg, var(--dot), var(--dot-2));
    border: none; border-radius: 999px;
    cursor: pointer;
  }
  
    /* ================= 主导航（移动端横向滚动） ================= */
    .tabs {
      display: flex;
      flex-wrap: nowrap;
      gap: 8px;
      max-width: 1040px;
      margin: 0 auto 24px;
      padding-bottom: 6px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
  
    .tabs::-webkit-scrollbar { display: none; }
  
    .tab {
      flex-shrink: 0;
      padding: 8px 16px;
      font: inherit; font-size: 13px;
      color: var(--text);
      background: #fff;
      border: 1px solid var(--card-border);
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
      transition: color .2s, background .2s, box-shadow .2s;
    }
  
    .tab.is-active {
      color: #fff;
      background: linear-gradient(135deg, var(--dot), var(--dot-2));
      border-color: transparent;
      box-shadow: 0 5px 14px rgba(91, 124, 250, .3);
    }
  
    /* ================= 主容器 ================= */
    .main { max-width: 1040px; margin: 0 auto; }
  
    /* ================= 编辑表单 ================= */
    .editor {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 16px;
      margin-bottom: 24px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      box-shadow: 0 6px 20px rgba(31, 36, 48, .06);
      transition: border-color .25s;
    }
  
    .editor[data-editing="true"] {
      border-color: var(--dot);
      box-shadow: 0 0 0 3px rgba(91, 124, 250, .12), 0 6px 20px rgba(31, 36, 48, .06);
    }
  
    .editor--compact { padding: 14px; margin-bottom: 16px; background: #fafbfe; box-shadow: none; }
  
    .field { display: flex; flex-direction: column; gap: 5px; }
    .field--full { grid-column: 1 / -1; }
    .field label { font-size: 12px; color: var(--muted); letter-spacing: .04em; }
  
    .field input[type="text"],
    .field textarea,
    .field select {
      width: 100%;
      padding: 10px 12px;
      font: inherit; font-size: 16px;  /* 16px 防止 iOS 自动放大 */
      color: var(--title);
      background: #fbfcfe;
      border: 1px solid #dfe3ee;
      border-radius: 10px;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
  
    .field textarea { resize: vertical; min-height: 56px; }
  
    .field input:focus, .field textarea:focus, .field select:focus {
      background: #fff;
      border-color: var(--dot);
      box-shadow: 0 0 0 3px rgba(91, 124, 250, .15);
    }
  
    .field input[type="file"] {
      width: 100%; padding: 8px 10px;
      font: inherit; font-size: 13px;
      color: var(--text);
      background: #fbfcfe;
      border: 1px dashed #d5dbeb;
      border-radius: 10px;
      cursor: pointer;
    }
  
    .avatar-preview { margin-top: 8px; }
    .avatar-preview img { max-width: 130px; max-height: 130px; border-radius: 10px; border: 1px solid var(--card-border); display: block; }
  
    .field__tools { display: flex; justify-content: flex-end; margin-top: 2px; }
  
    .link-btn {
      padding: 4px 12px;
      font: inherit; font-size: 12px;
      color: var(--dot);
      background: rgba(91, 124, 250, .10);
      border: none; border-radius: 999px;
      cursor: pointer;
    }
  
    .form-actions { grid-column: 1 / -1; display: flex; gap: 10px; }
  
    .btn {
      flex: 1 1 auto;
      padding: 12px 16px;
      font: inherit; font-size: 15px; font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, var(--dot), var(--dot-2));
      border: none; border-radius: 10px;
      cursor: pointer;
      transition: transform .15s, box-shadow .2s;
    }
  
    .btn:active { transform: scale(.98); }
  
    .btn--ghost {
      flex: 0 0 auto;
      color: var(--text);
      background: #fff;
      border: 1px solid #dfe3ee;
      font-weight: 500;
    }
  
    /* ================= 时间轴 ================= */
    .timeline { position: relative; max-width: 960px; margin: 0 auto; padding: 24px 0; }
  
    .timeline::before {
      content: ""; position: absolute;
      left: 50%; top: 0; bottom: 0;
      width: 2px; margin-left: -1px;
      background: var(--line); border-radius: 2px;
    }
  
    .timeline.is-empty::before { display: none; }
  
    .timeline__empty, .empty {
      margin: 0; padding: 28px 16px;
      text-align: center; font-size: 14px;
      color: var(--muted);
      background: var(--card-bg);
      border: 1px dashed #d7dcea; border-radius: 14px;
    }
  
    .entries > .empty { grid-column: 1 / -1; }
  
    .timeline-item { position: relative; width: 50%; padding: 0 var(--gap) var(--vgap) 0; }
    .timeline-item:nth-child(even) { margin-left: 50%; padding: 0 0 var(--vgap) var(--gap); }
    .timeline-item:last-child { padding-bottom: 0; }
  
    .timeline-item::before {
      content: ""; position: absolute;
      top: var(--dot-top); width: 14px; height: 14px;
      border-radius: 50%; background: var(--dot);
      box-shadow: 0 0 0 4px var(--bg), 0 0 0 5px rgba(91, 124, 250, .25);
      z-index: 2;
    }
  
    .timeline-item:nth-child(odd)::before  { right: -7px; }
    .timeline-item:nth-child(even)::before { left:  -7px; }
  
    .timeline-item::after {
      content: ""; position: absolute;
      top: calc(var(--dot-top) + 7px);
      width: var(--gap); height: 1px; background: var(--line);
    }
  
    .timeline-item:nth-child(odd)::after  { right: 0; }
    .timeline-item:nth-child(even)::after { left:  0; }
  
    .card {
      position: relative;
      padding: 16px 70px 18px 18px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      box-shadow: 0 6px 18px rgba(31, 36, 48, .06);
      transition: transform .25s, box-shadow .25s, border-color .3s, background .6s;
    }
  
    .card__time {
      display: inline-block; margin-bottom: 8px;
      padding: 3px 10px; font-size: 12px;
      color: var(--dot); background: rgba(91, 124, 250, .10);
      border-radius: 999px;
    }
	
	  .card__title { margin: 0 0 6px; font-size: 16px; line-height: 1.5; }
	  .card__desc { margin: 0; font-size: 14px; color: var(--text); white-space: pre-line; }
	
	  /* ================= 通用条目卡片 ================= */
	  .entries { 
		  display: grid; 
		  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
		  gap: 14px; 
	  }

	.entries--stories { grid-template-columns: 1fr; }

.story-body {
  min-height: 320px;
  font-size: 15px;
  line-height: 1.8;
}
	
	  .entry {
	    position: relative;
	    padding: 16px 70px 16px 18px;
	    background: var(--card-bg);
	    border: 1px solid var(--card-border);
	    border-radius: 14px;
	    box-shadow: 0 4px 14px rgba(31, 36, 48, .05);
	    transition: transform .2s, box-shadow .2s, border-color .3s, background .6s;
	  }
	
	  .entry__name { margin: 0 0 6px; font-size: 16px; line-height: 1.5; }
	  .entry__intro { margin: 0; font-size: 14px; color: var(--text); white-space: pre-line; }
	  .entry__meta { margin: 8px 0 0; font-size: 13px; color: var(--text); white-space: pre-line; }
	
	  .entry__label {
	    display: inline-block; margin-right: 6px;
	    padding: 1px 9px; font-size: 11px;
	    color: var(--muted); background: #f1f3fa;
	    border-radius: 999px; vertical-align: 1px;
	  }
	
	  .entry__head { display: flex; gap: 12px; align-items: flex-start; }
	
	  .entry__avatar {
	    width: 60px; height: 60px; object-fit: cover;
	    border-radius: 10px; border: 1px solid var(--card-border);
	    flex-shrink: 0; background: #f1f3fa;
	  }
	
	  .entry__tags { display: flex; flex-wrap: wrap; gap: 5px; margin: 0; padding: 0; list-style: none; }
	
	  .tag {
	    padding: 2px 9px; font-size: 11px;
	    color: var(--dot); background: rgba(91, 124, 250, .10);
	    border-radius: 999px;
	  }
	
	  .entry-link {
	    color: var(--dot); text-decoration: none;
	    border-bottom: 1px dashed rgba(91, 124, 250, .5);
	    cursor: pointer;
	  }
	
	  /* 高亮 */
	  @keyframes flashHighlight {
	    0%   { background-color: var(--highlight); border-color: var(--highlight); }
	    100% { background-color: var(--card-bg); border-color: var(--card-border); }
	  }
	
	  .is-highlight { animation: flashHighlight 1.8s ease-out; }
	
	  /* ---- 操作按钮 ---- */
	  .entry__edit, .entry__del, .card__edit, .card__del {
	    position: absolute; top: 10px;
	    width: 28px; height: 28px;
	    display: grid; place-items: center;
	    padding: 0; font-size: 16px; line-height: 1;
	    color: var(--muted); background: #f1f3fa;
	    border: none; border-radius: 50%;
	    cursor: pointer;
	    opacity: 1;  /* 移动端常驻显示 */
	    transition: opacity .2s, background .2s, color .2s;
	  }
	
	  .entry__edit, .card__edit { right: 42px; font-size: 13px; }
	  .entry__del,  .card__del  { right: 10px; }
	
	  .entry__edit:active, .card__edit:active { background: var(--dot); color: #fff; }
	  .entry__del:active,  .card__del:active  { background: var(--danger); color: #fff; }
	
	  .entry__del--static { position: static; opacity: 1; flex-shrink: 0; }
	
	  /* 桌面端 hover 时才显示操作按钮 */
	  @media (hover: hover) {
	    .entry__edit, .entry__del, .card__edit, .card__del { opacity: 0; }
	    .entry:hover .entry__edit, .entry:hover .entry__del,
	    .card:hover .card__edit, .card:hover .card__del,
	    .entry:focus-within .entry__edit, .entry:focus-within .entry__del,
	    .card:focus-within .card__edit, .card:focus-within .card__del { opacity: 1; }
	  }
	
	  /* ================= 世界容器 ================= */
	  .worlds { display: flex; flex-direction: column; gap: 18px; }
	
	  .world {
	    padding: 16px;
	    background: var(--card-bg);
	    border: 1px solid var(--card-border);
	    border-radius: 16px;
	    box-shadow: 0 6px 20px rgba(31, 36, 48, .06);
	  }
	
	  .world__head {
	    display: flex; align-items: center; justify-content: space-between;
	    gap: 10px; margin-bottom: 12px;
	  }
	
	  .world__name { margin: 0; font-size: 17px; }
	
	  .subtabs {
	    display: flex; flex-wrap: nowrap; gap: 5px;
	    margin-bottom: 14px; padding-bottom: 12px;
	    border-bottom: 1px solid var(--card-border);
	    overflow-x: auto;
	    -webkit-overflow-scrolling: touch;
	    scrollbar-width: none;
	  }
	
	  .subtabs::-webkit-scrollbar { display: none; }
	
	  .subtab {
	    flex-shrink: 0;
	    padding: 6px 12px;
	    font: inherit; font-size: 12px;
	    color: var(--text); background: #f4f5fa;
	    border: 1px solid transparent; border-radius: 999px;
	    cursor: pointer; white-space: nowrap;
	  }
	
	  .subtab.is-active {
	    color: #fff;
	    background: linear-gradient(135deg, var(--dot), var(--dot-2));
	  }
	
	  /* ================= 搜索结果 ================= */
	  .search-info {
	    margin: 0 0 16px; padding: 12px 16px;
	    font-size: 14px; color: var(--text);
	    background: var(--card-bg);
	    border: 1px solid var(--card-border);
	    border-radius: 12px;
	  }
	
	  .search-info strong { color: var(--dot); }
	
	  .search-tag {
	    display: inline-block; margin-bottom: 6px;
	    padding: 2px 10px; font-size: 11px;
	    color: var(--dot); background: rgba(91, 124, 250, .10);
	    border-radius: 999px;
	  }
	
	  /* ================= 登录模态框 ================= */
	  .modal { position: fixed; inset: 0; z-index: 200; display: grid; place-items: center; }
	  .modal[hidden] { display: none; }
	
	  .modal__backdrop { position: absolute; inset: 0; background: rgba(31, 36, 48, .5); }
	
	  .modal__box {
	    position: relative;
	    width: min(420px, calc(100% - 32px));
	    background: #fff; border-radius: 16px;
	    box-shadow: 0 24px 60px rgba(31, 36, 48, .3);
	    overflow: hidden;
	  }
	
	  .modal__head {
	    display: flex; align-items: center; justify-content: space-between;
	    padding: 14px 18px; border-bottom: 1px solid var(--card-border);
	  }
	
	  .modal__title { margin: 0; font-size: 16px; }
	
	  .modal__close {
	    width: 30px; height: 30px; display: grid; place-items: center;
	    font-size: 20px; line-height: 1; color: var(--muted);
	    background: #f1f3fa; border: none; border-radius: 50%; cursor: pointer;
	  }
	
	  .modal__body { padding: 16px 18px 20px; }
	
	  .modal__body .field { margin-bottom: 12px; }
	
	  .modal__body .btn { width: 100%; }
	
	  .modal__hint { margin: 0 0 14px; font-size: 13px; color: var(--muted); }
	
	  .link-group { margin-bottom: 16px; }
	  .link-group__label { margin: 0 0 8px; font-size: 12px; color: var(--muted); }
	  .link-list { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
	
	  .link-item {
	    padding: 6px 12px; font: inherit; font-size: 13px;
	    color: var(--text); background: #f4f5fa;
	    border: none; border-radius: 8px; cursor: pointer;
	  }
	  
	    /* ================= Toast ================= */
	    .toast {
	      position: fixed; left: 50%; bottom: 28px; z-index: 300;
	      padding: 10px 20px; font-size: 13px;
	      color: #fff; background: rgba(31, 36, 48, .93);
	      border-radius: 999px; opacity: 0; pointer-events: none;
	      transform: translate(-50%, 12px);
	      transition: opacity .25s, transform .25s;
	    }
	  
	    .toast.is-visible { opacity: 1; transform: translate(-50%, 0); }
	    .toast.is-err { background: var(--danger); }
	  
	    /* ================= 加载遮罩 ================= */
	    .loading {
	      position: fixed; inset: 0; z-index: 400;
	      display: grid; place-items: center;
	      background: rgba(245, 246, 250, .8);
	      font-size: 14px; color: var(--muted);
	    }
	  
	    .loading[hidden] { display: none; }
	  
	    /* ================= 响应式：窄屏单侧布局 ================= */
	    @media (max-width: 720px) {
	      :root { --gap: 22px; --vgap: 28px; --dot-top: 18px; }
	  
	      body { padding: 20px 12px 90px; }
	  
	      .editor { grid-template-columns: 1fr; }
	  
	      .timeline::before { left: 7px; margin-left: -1px; }
	  
	      .timeline-item,
	      .timeline-item:nth-child(even) {
	        width: 100%; margin-left: 0;
	        padding: 0 0 var(--vgap) 32px;
	      }
	  
	      .timeline-item:last-child { padding-bottom: 0; }
	  
	      .timeline-item:nth-child(odd)::before,
	      .timeline-item:nth-child(even)::before { left: 0; right: auto; }
	  
	      .timeline-item:nth-child(odd)::after,
	      .timeline-item:nth-child(even)::after {
	        left: 14px; right: auto; width: 18px;
	      }
	  
	      .card, .entry { padding-right: 66px; }
	    }
	  </style>
	  </head>
	  <body>
	  
	  <div class="loading" id="loading">正在加载…</div>
	  
	  <header class="hero">
	    <h1 class="hero__title">未来编年史</h1>
	    <p class="hero__sub">Epic of the Future</p >
	  </header>
	  
	  <!-- 登录状态栏 -->
	  <div class="auth-bar" id="authBar">
	    <span class="auth-bar__dot" id="authDot"></span>
	    <span id="authText">未登录 · 仅可查看</span>
	    <button class="auth-bar__btn" id="authBtn" type="button">登录</button>
	  </div>
	  
	  <div class="searchbar">
	    <input type="text" id="searchInput" class="searchbar__input" placeholder="搜索…" enterkeyhint="search">
	    <button type="button" id="searchBtn" class="searchbar__btn">搜索</button>
	  </div>
	  
	  <nav class="tabs" id="mainTabs"></nav>
	  <main class="main" id="main"></main>
	  
	  <!-- 登录模态框 -->
	  <div class="modal" id="authModal" hidden>
	    <div class="modal__backdrop" data-action="close-auth-modal"></div>
	    <div class="modal__box">
	      <header class="modal__head">
	        <h3 class="modal__title">管理员登录</h3>
	        <button class="modal__close" type="button" data-action="close-auth-modal">×</button>
	      </header>
	      <div class="modal__body">
	        <p class="modal__hint">仅管理员可登录并编辑内容。</p >

	          <label>邮箱</label>
	          <input type="text" id="authEmail" placeholder="you@example.com" autocomplete="email">
	        </div>
	        <div class="field">
	          <label>密码</label>
	          <input type="password" id="authPassword" placeholder="密码" autocomplete="current-password">
	        </div>
	        <button class="btn" id="authSubmit" type="button">登录</button>
	      </div>
	    </div>
	  </div>
	  
	  <!-- 链接选择模态框 -->
	  <div class="modal" id="linkModal" hidden>
	    <div class="modal__backdrop" data-action="close-link-modal"></div>
	    <div class="modal__box">
	      <header class="modal__head">
	        <h3 class="modal__title">选择要链接的条目</h3>
	        <button class="modal__close" type="button" data-action="close-link-modal">×</button>
	      </header>
	      <div class="modal__body" id="linkModalBody"></div>
	    </div>
	  </div>
	  
	  <div class="toast" id="toast" role="status" aria-live="polite"></div>

		     /* ============================================================

		     function uid() {
		       return crypto.randomUUID ? crypto.randomUUID()
		         : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
		             var r = Math.random() * 16 | 0;
		             return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
		           });
		     }
		   
		     var ESC_MAP = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
		     function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return ESC_MAP[c]; }); }
		   
		     function renderRichText(text) {
		       if (!text) return '';
		       var str = String(text), result = '', last = 0, match;
		       LINK_RE.lastIndex = 0;
		       while ((match = LINK_RE.exec(str)) !== null) {
		         result += esc(str.slice(last, match.index));
		         result += '<a class="entry-link" href=" " data-link-id="' +
		           esc(match[1]) + '">' + esc(match[2] || '链接') + '</a >';
		         last = match.index + match[0].length;
		       }
		       result += esc(str.slice(last));
		       return result;
		     }
		   
		     function plainText(t) { return String(t == null ? '' : t).replace(LINK_RE, '$2'); }
		   
		     var toastTimer = null;
		     function toast(msg, type) {
		       var el = document.getElementById('toast');
		       if (!el) return;
		       el.textContent = msg;
		       el.className = 'toast is-visible' + (type === 'err' ? ' is-err' : '');
		       clearTimeout(toastTimer);
		       toastTimer = setTimeout(function () { el.className = 'toast'; }, 2400);
		     }
		   
		     function fileToDataUrl(file) {
		       return new Promise(function (res, rej) {
		         var r = new FileReader();
		         r.onload = function () { res(r.result); };
		         r.onerror = rej;
		         r.readAsDataURL(file);
		       });
		     }
		   
		     function shrinkImage(dataUrl, maxSize) {
		       return new Promise(function (resolve) {
		         var img = new Image();
		         img.onload = function () {
		           var w = img.width, h = img.height;
		           if (w <= maxSize && h <= maxSize) { resolve(dataUrl); return; }
		           var ratio = Math.min(maxSize / w, maxSize / h);
		           w = Math.round(w * ratio); h = Math.round(h * ratio);
		           var c = document.createElement('canvas');
		           c.width = w; c.height = h;
		           c.getContext('2d').drawImage(img, 0, 0, w, h);
		           resolve(c.toDataURL('image/jpeg', 0.82));
		         };
		         img.onerror = function () { resolve(dataUrl); };
		         img.src = dataUrl;
		       });
		     }

		     /* 从 Supabase 拉取全部数据 */
		     async function fetchAll() {
		       var res = await supabase.from('entries').select('*').order('created_at', { ascending: true });
		       if (res.error) {
		         console.error('加载失败：', res.error);
		         toast('数据加载失败，请刷新重试', 'err');
		         return;
		       }
		   
		       /* 重置本地缓存 */
		       store.timeline = []; store.factions = []; store.races = [];
		       store.characters = []; store.settings = [];
		       store.attached = []; store.parallel = []; store.stories = [];
		   
		       var rows = res.data || [];
		   
		       /* 先把所有世界容器建立索引（parent_id → world对象） */
		       var worldMap = {};
		       rows.forEach(function (row) {
		         if (row.module === 'attached' || row.module === 'parallel') {
		           if (!row.parent_id) {
		             var world = Object.assign({ id: row.id }, row.data);
		             world.factions = []; world.races = [];
		             world.characters = []; world.settings = []; 
					 world.stories = [];
		             store[row.module].push(world);
		             worldMap[row.id] = world;
		           }
		         }
		       });
		   
		       /* 再填充各个条目 */
		       rows.forEach(function (row) {
		         var item = Object.assign({ id: row.id }, row.data);
		   
		         if (row.parent_id && row.sub_module && worldMap[row.parent_id]) {
		           /* 世界容器的子条目 */
		           var world = worldMap[row.parent_id];
		           if (!world[row.sub_module]) world[row.sub_module] = [];
		           world[row.sub_module].push(item);
		         } else if (row.module === 'timeline') {
		           store.timeline.push(item);
		         } else if (row.module === 'factions' || row.module === 'races' ||
		                    row.module === 'characters' || row.module === 'settings' || 
						   row.module === 'stories') {
		           store[row.module].push(item);
		         }
		         /* 世界容器本身已经处理过了，跳过 */
		       });
		     }
		   
		     /* 插入一条记录 */
		     async function dbInsert(module, parentId, subModule, data) {
		       var row = {
		         module: module,
		         parent_id: parentId || null,
		         sub_module: subModule || null,
		         data: data
		       };
		       var res = await supabase.from('entries').insert(row).select().single();
		       if (res.error) { console.error(res.error); toast('保存失败', 'err'); return null; }
		       return res.data;
		     }
		   
		     /* 更新一条记录 */
		     async function dbUpdate(id, data) {
		       var res = await supabase.from('entries')
		         .update({ data: data, updated_at: new Date().toISOString() })
		         .eq('id', id);
		       if (res.error) { console.error(res.error); toast('更新失败', 'err'); return false; }
		       return true;
		     }
		   
		     /* 删除一条记录 */
		     async function dbDelete(id) {
		       var res = await supabase.from('entries').delete().eq('id', id);
		       if (res.error) { console.error(res.error); toast('删除失败', 'err'); return false; }
		       return true;
		     }

			   function getList(worldKey, worldId, listKey) {
			     if (!worldKey) return store[listKey] || null;
			     var worlds = store[worldKey] || [];
			     for (var i = 0; i < worlds.length; i++) {
			       if (worlds[i].id === worldId) {
			         if (!Array.isArray(worlds[i][listKey])) worlds[i][listKey] = [];
			         return worlds[i][listKey];
			       }
			     }
			     return null;
			   }
			 
			   function getEntryById(worldKey, worldId, listKey, id) {
			     var list = getList(worldKey, worldId, listKey);
			     if (!list) return null;
			     for (var i = 0; i < list.length; i++) {
			       if (list[i].id === id) return list[i];
			     }
			     return null;
			   }
			 
			   function findCharacter(id) {
			     if (!id) return null;
			     for (var i = 0; i < store.characters.length; i++) {
			       if (store.characters[i].id === id) return store.characters[i];
			     }
			     return null;
			   }
			 
			   function characterPool(worldKey, worldId) {
			     var pool = store.characters.slice();
			     if (worldKey && worldId) {
			       var worlds = store[worldKey] || [];
			       for (var i = 0; i < worlds.length; i++) {
			         if (worlds[i].id === worldId) {
			           if (Array.isArray(worlds[i].characters)) pool = pool.concat(worlds[i].characters);
			           break;
			         }
			       }
			     }
			     return pool;
			   }
			 
			   function isEditing(listKey, worldKey, worldId) {
			     var e = state.editing;
			     if (!e) return false;
			     return e.listKey === listKey &&

			            (e.worldId || '') === (worldId || '');
			   }

				   function scoreText(text, kw) {
				     if (!text) return 0;
				     var t = String(text).toLowerCase();
				     if (t === kw) return 100;
				     if (t.indexOf(kw) === 0) return 60;
				     if (t.indexOf(kw) !== -1) return 30;
				     return 0;
				   }
				 
				   function scoreFields(fields, kw) {
				     var best = 0;
				     fields.forEach(function (f) {
				       var s = scoreText(plainText(f), kw);
				       if (s > best) best = s;
				     });
				     return best;
				   }
				 
				   function searchAll(keyword) {
				     var kw = keyword.trim().toLowerCase();
				     if (!kw) return [];
				     var results = [];
				 
				     store.timeline.forEach(function (t) {
				       var s = scoreFields([t.time, t.title, t.desc], kw);
				       if (s > 0) results.push({ type: '时间轴', title: t.title, time: t.time, desc: t.desc, score: s });
				     });
				 
				     ['factions', 'races', 'settings'].forEach(function (key) {
				       (store[key] || []).forEach(function (item) {
				         var member = findCharacter(item.memberId);
				         var s = scoreFields([item.name, item.intro, member ? member.name : ''], kw);
				         if (s > 0) results.push({ type: SIMPLE_LABELS[key], title: item.name, desc: item.intro, score: s });
				       });
				     });
				 
				     store.characters.forEach(function (c) {
				       var s = scoreFields([c.name, c.gender, c.race, c.job, c.intro, c.ability], kw);
				       if (s > 0) results.push({ type: '角色', title: c.name, desc: c.intro, score: s });
				     });

					   (store.stories || []).forEach(function (s) {
  var sc = scoreFields([s.title, s.subtitle, s.body], kw);
  if (sc > 0) results.push({ type: '故事', title: s.title, desc: s.subtitle || s.body, score: sc });
});
				 
				     [['attached', '附属世界观'], ['parallel', '平行宇宙']].forEach(function (pair) {
				       (store[pair[0]] || []).forEach(function (w) {
				         var ws = scoreFields([w.name], kw);
				         if (ws > 0) results.push({ type: pair[1], title: w.name, desc: '', score: ws });
				 
				         ['factions', 'races', 'settings'].forEach(function (sub) {
				           (w[sub] || []).forEach(function (item) {
				             var member = findCharacter(item.memberId);
				             var s = scoreFields([item.name, item.intro, member ? member.name : ''], kw);
				             if (s > 0) results.push({ type: pair[1] + ' · ' + SIMPLE_LABELS[sub], title: item.name, desc: item.intro, score: s });
				           });
				         });
				 
				         (w.characters || []).forEach(function (c) {
				           var s = scoreFields([c.name, c.gender, c.race, c.job, c.intro, c.ability], kw);
				           if (s > 0) results.push({ type: pair[1] + ' · 角色', title: c.name, desc: c.intro, score: s });
				         });
				       });

					   (w.stories || []).forEach(function (s) {

				     results.sort(function (a, b) { return b.score - a.score; });

				         case 'add-simple':    submitSimple(btn); break;
				         case 'add-character': submitCharacter(btn); break;
						 case 'add-story':     submitStory(btn); break;
				         case 'add-world':     addWorld(btn); break;
				         case 'del-entry':     delEntry(btn); break;
				         case 'del-world':     delWorld(btn); break;
				         case 'edit-entry':    startEdit(btn); break;
				         case 'cancel-edit':   cancelEdit(); break;
				         case 'sub-tab':       switchSubTab(btn); break;
				         case 'open-link-picker': openLinkPicker(btn); break;
				       }
				     });
				   
				     mainEl.addEventListener('change', function (e) {
				       var input = e.target.closest('input[type="file"][data-field="avatar"]');
				       if (!input) return;
				       var editor = input.closest('.editor');
				       var preview = editor.querySelector('.avatar-preview');
				       var file = input.files && input.files[0];
				   
				       if (!file) { editor.__pendingAvatar = null; if (preview) preview.innerHTML = ''; return; }
				   
				       fileToDataUrl(file).then(function (raw) { return shrinkImage(raw, 320); })
				         .then(function (small) {
				           editor.__pendingAvatar = small;
				           if (preview) preview.innerHTML = '< img src="' + small + '" alt="">';
				         }).catch(function () { toast('图片读取失败', 'err'); });
				     });
				   
				     mainEl.addEventListener('keydown', function (e) {
				       if (!(e.ctrlKey || e.metaKey) || e.key !== 'Enter') return;
				       var editor = e.target.closest('.editor');
				       if (!editor) return;
				       var btn = editor.querySelector('[data-action^="add-"]');
				       if (btn) btn.click();
				     });
					 
					   /* 主标签切换 */
					   document.getElementById('mainTabs').addEventListener('click', function (e) {
					     var tab = e.target.closest('[data-tab]');
					     if (!tab) return;
					     var key = tab.dataset.tab;
					     if (state.activeTab === key) return;
					     state.editing = null;
					     state.activeTab = key;
					     render();
					   });
					 
					   /* 链接模态框 */
					   document.getElementById('linkModal').addEventListener('click', function (e) {
					     if (e.target.closest('[data-action="close-link-modal"]')) { closeLinkModal(); return; }
					     var item = e.target.closest('.link-item');
					     if (item) pickLinkTarget(item.dataset.linkId, item.dataset.linkName);
					   });
					 
					   /* 搜索 */
					   var searchInput = document.getElementById('searchInput');
					   document.getElementById('searchBtn').addEventListener('click', function () {
					     var kw = (searchInput.value || '').trim();
					     if (!kw) { toast('请输入搜索内容', 'err'); searchInput.focus(); return; }
					     state.editing = null;
					     state.searchKeyword = kw;
					     state.activeTab = 'search';
					     render();
					   });
					   searchInput.addEventListener('keydown', function (e) {
					     if (e.key === 'Enter') { e.preventDefault(); document.getElementById('searchBtn').click(); }
					   });
					 
					   /* ============================================================
					      登录 / 退出
					      ============================================================ */
					   document.getElementById('authBtn').addEventListener('click', async function () {
					     if (isAdmin) {
					       /* 退出 */
					       await supabase.auth.signOut();
					       isAdmin = false;
					       state.editing = null;
					       render();
					       toast('已退出登录');
					     } else {
					       /* 打开登录框 */
					       document.getElementById('authModal').hidden = false;
					       document.getElementById('authEmail').focus();
					     }
					   });
					 
					   document.getElementById('authSubmit').addEventListener('click', async function () {
					     var email = document.getElementById('authEmail').value.trim();
					     var password = document.getElementById('authPassword').value;
					     if (!email || !password) { toast('请填写邮箱和密码', 'err'); return; }
					 
					     var res = await supabase.auth.signInWithPassword({ email: email, password: password });
					     if (res.error) {
					       toast('登录失败：' + res.error.message, 'err');
					       return;
					     }
					 
					     isAdmin = true;
					     document.getElementById('authModal').hidden = true;
					     document.getElementById('authPassword').value = '';
					     await fetchAll();
					     render();
					     toast('登录成功，管理员模式已开启');
					   });
					 
					   document.getElementById('authModal').addEventListener('click', function (e) {
					     if (e.target.closest('[data-action="close-auth-modal"]')) {
					       document.getElementById('authModal').hidden = true;
					     }
					   });
					 
					   /* ESC 关闭模态框 */
					   document.addEventListener('keydown', function (e) {
					     if (e.key === 'Escape') {
					       var am = document.getElementById('authModal');
					       var lm = document.getElementById('linkModal');
					       if (am && !am.hidden) am.hidden = true;
					       if (lm && !lm.hidden) closeLinkModal();
					     }
					   });
					 
					   /* ============================================================
					      初始化
					      ============================================================ */
					   async function init() {
					     /* 检查是否已有登录会话 */
					     var session = await supabase.auth.getSession();
					     if (session.data && session.data.session) {
					       isAdmin = true;
					     }
					 
					     await fetchAll();
					     document.getElementById('loading').hidden = true;
					     render();
					   }
					 
					   /* 监听登录状态变化（比如 token 过期） */
					   supabase.auth.onAuthStateChange(function (event, session) {
					     var wasAdmin = isAdmin;
					     isAdmin = !!session;
					     if (wasAdmin !== isAdmin) {
					       state.editing = null;
					       render();
					     }
					   });
					 
					   init();
					 
					 })();
					 </script>
					 </body>
					 </html>
